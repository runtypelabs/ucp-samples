[project]
name = "ucp-demo-server"
version = "0.1.0"
description = "UCP Demo Server on Cloudflare Workers"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "httpx",
]

[dependency-groups]
dev = [
    "workers-py",
    "workers-runtime-sdk",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
